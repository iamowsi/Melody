name: Generate Release Keystore (One-Time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore and Base64
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Error: KEY_ALIAS or KEYSTORE_PASSWORD secret is missing!"
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore melody-release.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Melody, OU=Mobile, O=Mustafa, L=Tehran, ST=Tehran, C=IR"

          base64 -w 0 melody-release.jks > keystore-base64.txt

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: melody-keystore-backup
          path: |
            melody-release.jks
            keystore-base64.txt
          retention-days: 1
